<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Standup">
<meta name="theme-color" content="#FFFFFF">
<title>Standup Log</title>
<style>
  :root{
    --ink:#131A22;
    --ink-2:#33414F;
    --muted:#6B7C8C;
    --paper:#E8ECF0;
    --card:#FFFFFF;
    --rule:#CFD8E0;
    --rule-soft:#E3E9EE;
    --pine:#2F6F6B;
    --pine-dark:#215350;
    --pine-tint:#E4EFEE;
    --flag:#BE3F29;
    --flag-tint:#FBE9E5;
    --amber:#B0761B;
    --amber-tint:#FBF0DD;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Sarabun", Roboto, "Helvetica Neue", Arial, sans-serif;
    --r:10px;
  }
  *{box-sizing:border-box}
  body{margin:0}
  .app{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    min-height:100vh;
    padding:0 0 64px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* ---------- masthead ---------- */
  .masthead{
    border-bottom:1px solid var(--rule);
    background:var(--card);
    position:sticky;top:0;z-index:40;
  }
  .masthead .wrap{display:flex;align-items:center;gap:18px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:3px;margin-right:auto}
  .brand b{
    font-family:var(--mono);font-size:14px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;
  }
  .brand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
  .datefield{display:flex;align-items:center;gap:8px}
  .datefield label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  input[type=date]{
    font-family:var(--mono);font-size:13px;color:var(--ink);
    border:1px solid var(--rule);border-radius:var(--r);padding:7px 9px;background:var(--card);
  }
  .savestate{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:96px;text-align:right}
  .savestate.on{color:var(--pine)}

  /* ---------- tabs ---------- */
  .tabs{background:var(--card);border-bottom:1px solid var(--rule)}
  .tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  .tabs .wrap::-webkit-scrollbar{display:none}
  .tab{
    appearance:none;background:none;border:0;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);padding:12px 14px;border-bottom:2px solid transparent;white-space:nowrap;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--pine)}

  /* ---------- generic ---------- */
  h2{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;font-weight:600}
  h3{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
  p.lede{color:var(--ink-2);font-size:14px;line-height:1.55;margin:0 0 18px;max-width:62ch}
  .btn{
    appearance:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;
    border:1px solid var(--rule);background:var(--card);color:var(--ink);
    padding:9px 14px;border-radius:var(--r);
  }
  .btn:hover{border-color:var(--ink-2)}
  .btn.primary{background:var(--pine);border-color:var(--pine);color:#fff}
  .btn.primary:hover{background:var(--pine-dark)}
  .btn.quiet{border-color:transparent;color:var(--muted);padding:6px 8px}
  .btn.quiet:hover{color:var(--flag)}
  .btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-visible,.roll-item:focus-visible{
    outline:2px solid var(--pine);outline-offset:2px
  }
  textarea,input[type=text],select{
    font-family:var(--sans);font-size:14px;color:var(--ink);width:100%;
    border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;background:var(--card);line-height:1.5;
  }
  textarea{resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:180px}
  .note{font-size:12px;color:var(--muted);line-height:1.5}
  .empty{
    border:1px dashed var(--rule);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);font-size:14px;background:var(--card)
  }

  /* ---------- standup layout ---------- */
  .standup{display:grid;grid-template-columns:280px 1fr;gap:26px;align-items:start;margin-top:24px}

  /* roll call rail — the signature element */
  .rail{
    background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;position:sticky;top:112px;
  }
  .rail-head{padding:14px 16px 12px;border-bottom:1px solid var(--rule-soft)}
  .rail-head b{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block}
  .rail-count{font-family:var(--mono);font-size:22px;margin-top:6px;letter-spacing:-.02em}
  .rail-count i{font-style:normal;color:var(--muted);font-size:13px}
  .meter{height:3px;background:var(--rule-soft);border-radius:2px;margin-top:10px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--pine);transition:width .35s ease}
  .roll{list-style:none;margin:0;padding:6px}
  .roll-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:0;cursor:pointer;padding:9px 10px;border-radius:8px;font-family:var(--sans);
  }
  .roll-item:hover{background:var(--paper)}
  .roll-item[aria-current=true]{background:var(--ink);color:#fff}
  .roll-item[aria-current=true] .roll-meta{color:#9AACBB}
  .roll-num{font-family:var(--mono);font-size:10px;color:var(--muted);width:16px;flex:none}
  .roll-item[aria-current=true] .roll-num{color:#7E93A4}
  .roll-name{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .roll-meta{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--rule);background:transparent;transition:background .2s}
  .dot.done{background:var(--pine);border-color:var(--pine)}
  .dot.flag{background:var(--flag);border-color:var(--flag)}
  .dot.out{background:var(--rule);border-color:var(--rule)}

  /* speaker card */
  .speaker{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:22px}
  .speaker-head{display:flex;align-items:flex-start;gap:14px;border-bottom:1px solid var(--rule-soft);padding-bottom:16px;margin-bottom:18px}
  .mark{
    width:44px;height:44px;border-radius:10px;flex:none;display:grid;place-items:center;
    font-family:var(--mono);font-size:15px;font-weight:700;color:#fff;letter-spacing:-.02em;
  }
  .speaker-id{flex:1;min-width:0}
  .speaker-id h3{font-size:20px}
  .speaker-id .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
  .field{margin-bottom:18px}
  .field > label{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    display:block;margin-bottom:7px
  }
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    appearance:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;font-weight:600;
    border:1px solid var(--rule);background:var(--card);color:var(--ink-2);
    padding:6px 11px;border-radius:999px;
  }
  .chip:hover{border-color:var(--ink-2)}
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.st-ok[aria-pressed=true]{background:var(--pine);border-color:var(--pine)}
  .chip.st-help[aria-pressed=true]{background:var(--amber);border-color:var(--amber)}
  .chip.st-block[aria-pressed=true]{background:var(--flag);border-color:var(--flag)}
  .chip.st-out[aria-pressed=true]{background:var(--muted);border-color:var(--muted)}
  .helpbox{background:var(--amber-tint);border:1px solid #EBDCC0;border-radius:var(--r);padding:14px;margin-bottom:18px}
  .helpbox.blocked{background:var(--flag-tint);border-color:#F0D2CB}
  .speaker-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--rule-soft);padding-top:16px;flex-wrap:wrap}

  /* ---------- summary ---------- */
  .digest{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:22px}
  .line{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule-soft)}
  .line:last-child{border-bottom:0}
  .line-name{font-family:var(--mono);font-size:12px;letter-spacing:.06em;width:120px;flex:none;padding-top:2px}
  .line-body{flex:1;min-width:0}
  .line-body ul{margin:0;padding-left:18px}
  .line-body li{font-size:14px;line-height:1.6;margin-bottom:2px}
  .tag{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:3px 7px;border-radius:5px;background:var(--paper);color:var(--muted);white-space:nowrap
  }
  .tag.help{background:var(--amber-tint);color:var(--amber)}
  .tag.block{background:var(--flag-tint);color:var(--flag)}
  .tag.ok{background:var(--pine-tint);color:var(--pine-dark)}
  .flow{display:flex;align-items:center;gap:8px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
  .flow:last-child{border-bottom:0}
  .flow .arrow{font-family:var(--mono);color:var(--muted)}
  .who{font-weight:600}

  /* ---------- import ---------- */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:20px}
  .parsed{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow:auto}
  .prow{border:1px solid var(--rule-soft);border-radius:8px;padding:12px;background:var(--card)}
  .prow.ambig{border-color:var(--amber);background:var(--amber-tint)}
  .prow.unknown{border-color:var(--rule);background:var(--paper)}
  .prow-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .prow-top select{width:auto;flex:1;font-size:13px;padding:6px 8px}
  .prow-raw{font-size:13px;color:var(--ink-2);line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .warn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}

  /* ---------- people / team ---------- */
  .people-grid{display:grid;grid-template-columns:240px 1fr;gap:26px;align-items:start}
  .stat-row{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:20px}
  .stat b{display:block;font-family:var(--mono);font-size:26px;letter-spacing:-.02em}
  .stat span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .daylog{border-left:2px solid var(--rule-soft);padding-left:16px;margin-left:4px}
  .daylog-day{position:relative;padding-bottom:18px}
  .daylog-day::before{content:"";position:absolute;left:-21px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--rule);border:2px solid var(--card)}
  .daylog-day.has-flag::before{background:var(--flag)}
  .daylog-date{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
  .member-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule-soft)}
  .member-row:last-child{border-bottom:0}
  .alias{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-word}

  .drop{border:1.5px dashed var(--rule);border-radius:var(--r);padding:22px;text-align:center;background:var(--paper);transition:border-color .15s,background .15s}
  .drop.over{border-color:var(--pine);background:var(--pine-tint)}
  .drop b{font-size:14px}
  .member-row.former{opacity:.72}
  .tprow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--rule-soft)}
  .tprow:last-child{border-bottom:0}
  .tpnum{font-family:var(--mono);font-size:10px;color:var(--muted);flex:none}
  .tptext{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tprow select{width:auto;max-width:210px;flex:none;font-size:12.5px;padding:5px 8px;color:var(--muted)}
  .tprow select.set{color:var(--ink);border-color:var(--pine)}
  .ptag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;background:var(--pine-tint);color:var(--pine-dark);padding:2px 6px;border-radius:4px;white-space:nowrap}
  .qrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-soft);font-size:13px}
  .qrow:last-child{border-bottom:0}
  .prow.newname{border-color:var(--amber);background:var(--amber-tint)}
  .taskrow{padding:10px 0;border-bottom:1px solid var(--rule-soft)}
  .taskrow:last-child{border-bottom:0}
  .chips.small{gap:5px}
  .chips.small .chip{padding:4px 9px;font-size:11.5px}

  .rpt-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);padding-bottom:14px}
  .rpt-table{width:100%;border-collapse:collapse;font-size:13px}
  .rpt-table th,.rpt-table td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
  .rpt-table th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right}
  .rpt-table td:first-child,.rpt-table th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
  .rpt-table tbody tr:hover td{background:var(--paper)}
  .rpt-table tr.rpt-total td{font-weight:600;border-top:1.5px solid var(--rule);border-bottom:0}
  .rpt-table td:empty::after{content:'–';color:var(--rule)}

  .storagebar{background:var(--flag-tint);border-bottom:1px solid #F0D2CB;color:#7C2A1B;font-size:13px;line-height:1.5}
  .storagebar .wrap{padding-top:10px;padding-bottom:10px}
  .storagebar b{font-weight:700}
  .storagebar.ok{background:var(--pine-tint);border-bottom-color:#CADEDC;color:var(--pine-dark)}

  pre.md{
    font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--ink);color:#D7E2EA;
    padding:18px;border-radius:var(--r);overflow:auto;max-height:460px;white-space:pre-wrap;margin:0
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:#fff;font-size:13px;padding:11px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:900px){
    .standup,.split,.people-grid{grid-template-columns:1fr}
    .rail{position:static}
    .roll{display:flex;overflow-x:auto;padding:8px}
    .roll-item{flex:none;width:auto}
    .roll-name{max-width:100px}
    .line{flex-direction:column;gap:6px}
    .line-name{width:auto}
  }

  /* ---------- phone ---------- */
  @media (max-width:620px){
    .wrap{padding:0 14px}
    .app{padding-bottom:40px}
    .masthead .wrap{gap:10px;padding-top:10px;padding-bottom:10px}
    .brand b{font-size:12px;letter-spacing:.18em}
    .brand span{font-size:10px}
    .datefield label{display:none}
    .savestate{min-width:0;font-size:10px}
    .tab{padding:11px 12px;font-size:10px}

    /* 16px stops iOS zooming the page when a field is focused */
    textarea,input[type=text],input[type=date],select{font-size:16px}
    .tprow select{font-size:15px}

    h2{margin:22px 0 10px}
    .speaker,.panel,.digest{padding:16px}
    .speaker-head{gap:11px;padding-bottom:13px;margin-bottom:15px}
    .speaker-id h3{font-size:18px}
    .mark{width:38px;height:38px;font-size:13px}

    /* roll call becomes a swipeable strip of names */
    .rail-head{padding:11px 13px 9px}
    .rail-count{font-size:18px}
    .roll{gap:6px;padding:8px 10px}
    .roll-item{padding:8px 11px;border:1px solid var(--rule-soft);border-radius:999px;gap:7px}
    .roll-item[aria-current=true]{border-color:var(--ink)}
    .roll-num{display:none}
    .roll-name{max-width:none;font-size:13px}

    /* comfortable tap targets */
    .chip{padding:9px 13px;font-size:13px}
    .btn{padding:11px 15px}
    .speaker-foot{gap:12px}
    .speaker-foot .row{width:100%}
    .speaker-foot .btn.primary{flex:1}

    /* task + project stacks instead of squeezing side by side */
    .tprow{flex-wrap:wrap;gap:6px;padding:9px 0}
    .tptext{flex-basis:100%;white-space:normal;overflow:visible}
    .tprow select{max-width:none;width:100%;flex:1}

    .qrow{flex-wrap:wrap;gap:6px}
    .drop{padding:16px}
    .stat-row{gap:18px}
    .stat b{font-size:21px}
    pre.md{font-size:11px;padding:14px}
    .prow-top{flex-wrap:wrap}
    .prow-top select{width:100%;flex-basis:100%}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="masthead">
    <div class="wrap">
      <div class="brand">
        <b>Standup&nbsp;Log</b>
        <span id="brandsub">08:00 · Innovation Team</span>
      </div>
      <div class="datefield">
        <label for="thedate">Meeting date</label>
        <input type="date" id="thedate">
      </div>
      <div class="savestate" id="savestate"></div>
    </div>
  </header>

  <nav class="tabs">
    <div class="wrap" role="tablist" id="tabs">
      <button class="tab" data-tab="standup" role="tab">Standup</button>
      <button class="tab" data-tab="summary" role="tab">Summary</button>
      <button class="tab" data-tab="import" role="tab">Import notes</button>
      <button class="tab" data-tab="people" role="tab">People</button>
      <button class="tab" data-tab="team" role="tab">Team</button>
      <button class="tab" data-tab="projects" role="tab">Projects</button>
      <button class="tab" data-tab="report" role="tab">Report</button>
      <button class="tab" data-tab="sync" role="tab">Sync</button>
    </div>
  </nav>

  <div id="storagebar" class="storagebar" hidden><div class="wrap" id="storagebar-text"></div></div>

  <main class="wrap" id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Standup Log — daily standup capture for a 12-person team
   Single file. Data persists via window.storage (per user).
   ============================================================ */

/* ---------- storage ----------
   Four tiers, best available wins:
   1. cloud         — Supabase, shared by every device and every signed-in person
   2. window.storage — the Claude artifact store (per account)
   3. localStorage  — this browser on this device
   4. memory        — nothing survives a refresh; the app says so out loud
   ------------------------------------------------------------ */
const mem = new Map();
const LS = (()=>{
  try{ const k='__sl_probe'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return localStorage; }
  catch(e){ return null; }
})();
const CFG_KEY='cfg:cloud', SESS_KEY='cfg:session';
function lsGet(k){ try{ const v=LS&&LS.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ if(LS){ v===null ? LS.removeItem(k) : LS.setItem(k,JSON.stringify(v)); } }catch(e){} }

const cloud = {
  cfg: null, session: null, lastError: '',
  configured(){ return !!(this.cfg && this.cfg.url && this.cfg.key); },
  ready(){ return this.configured() && !!(this.session && this.session.access_token); },
  load(){ this.cfg = lsGet(CFG_KEY); this.session = lsGet(SESS_KEY); },
  saveCfg(url, key){
    this.cfg = {url:String(url||'').trim().replace(/\/+$/,''), key:String(key||'').trim()};
    lsSet(CFG_KEY, this.cfg);
  },
  clear(){ this.cfg=null; this.session=null; lsSet(CFG_KEY,null); lsSet(SESS_KEY,null); },
  setSession(j, email){
    if(!j || !j.access_token) return false;
    this.session = {access_token:j.access_token, refresh_token:j.refresh_token,
      email:(j.user&&j.user.email)||email||'', at:Date.now()};
    lsSet(SESS_KEY, this.session);
    return true;
  },
  signOut(){ this.session=null; lsSet(SESS_KEY,null); },

  async req(path, opts={}, retry=true){
    const headers = Object.assign({'apikey':this.cfg.key,'Content-Type':'application/json'}, opts.headers||{});
    if(this.session && this.session.access_token) headers['Authorization']='Bearer '+this.session.access_token;
    const res = await fetch(this.cfg.url+path, Object.assign({}, opts, {headers}));
    if(res.status===401 && retry && this.session && this.session.refresh_token){
      if(await this.doRefresh()) return this.req(path, opts, false);
      this.signOut();
    }
    return res;
  },
  async doRefresh(){
    try{

function storageMode(){
  if(cloud.ready()) return 'cloud';
  if(window.storage) return 'account';
  if(LS) return 'device';
  return 'memory';
}

const store = {
  get mode(){ return storageMode(); },
  async get(k){
    const m = storageMode();
    if(m==='cloud'){
      try{ return await cloud.get(k); }catch(e){ console.error(e); return lsGet(k); }
    }
    if(m==='account'){
      try{ const r = await window.storage.get(k, false); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }                     // a missing key throws here
    }
    if(m==='device') return lsGet(k);
    return mem.has(k) ? JSON.parse(mem.get(k)) : null;
  },
  async set(k,v){
    const m = storageMode();
    mem.set(k, JSON.stringify(v));
    if(m==='cloud'){
      try{ await cloud.set(k,v); lsSet(k,v); return true; }    // local copy doubles as an offline cache
      catch(e){ console.error(e); lsSet(k,v); return false; }
    }
    if(m==='account'){
      try{ await window.storage.set(k, JSON.stringify(v), false); return true; }catch(e){ console.error(e); return false; }
    }
    if(m==='device'){ lsSet(k,v); return true; }
    return true;
  },
  async del(k){
    const m = storageMode();
    mem.delete(k);
    if(m==='cloud'){ try{ await cloud.del(k); }catch(e){} lsSet(k,null); return; }
    if(m==='account'){ try{ await window.storage.delete(k, false); }catch(e){} return; }
    if(m==='device') lsSet(k,null);
  },
  async keys(prefix){
    const m = storageMode();
    if(m==='cloud'){
      try{ return (await cloud.all(prefix)).map(r=>r.key); }catch(e){ console.error(e); }
    }
    if(m==='account'){
      try{
        const r = await window.storage.list(prefix, false);
        if(r && r.keys) return r.keys.map(k => typeof k === 'string' ? k : (k && k.key) || '').filter(Boolean);
      }catch(e){}
    }
    if(m==='device'){ try{ return Object.keys(LS).filter(k=>k.startsWith(prefix)); }catch(e){} }
    return [...mem.keys()].filter(k=>k.startsWith(prefix));
  },
  /* one round trip for everything under a prefix — used by People and Retag */
  async all(prefix){
    const m = storageMode();
    if(m==='cloud'){
      try{ return await cloud.all(prefix); }catch(e){ console.error(e); }
    }
    const out=[];
    for(const k of await this.keys(prefix)){
      const v = await this.get(k);
      if(v) out.push({key:k, value:v});
    }
    return out;
  }
};

/* longest keyword match wins; ascii keywords need a word boundary so
   "lis" does not fire on the word "list" */
function detectProject(text){
  const low = String(text||'').toLowerCase();
  let best='', bestLen=0;
  (S.projects||[]).forEach(p=>{
    (p.keywords||[]).forEach(k=>{
      const kw=String(k||'').toLowerCase().trim();
      if(!kw || kw.length<=bestLen) return;
      const ascii = /^[\x00-\x7F]+$/.test(kw);
      let hit;
      if(ascii){
        const safe=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        hit = new RegExp('(^|[^a-z0-9])'+safe+'([^a-z0-9]|$)','i').test(low);
      }else{
        hit = low.includes(kw);
      }
      if(hit){ best=p.id; bestLen=kw.length; }
    });
  });
  return best;
}

/* tasks are stored as {t: text, p: projectId, status, helpFrom, helpNote};
   older saves used plain strings, or {t,p} with status/helpFrom/helpNote per PERSON —
   both are upgraded on load. */
function asTask(x){
  if(x && typeof x==='object'){
    return {t:String(x.t||''), p:x.p||'', status:x.status||'', helpFrom:x.helpFrom||[], helpNote:x.helpNote||''};
  }
  const t=String(x||'');
  return {t, p:detectProject(t), status:'', helpFrom:[], helpNote:''};
}
function normalizeDay(d){
  Object.values(d.entries||{}).forEach(e=>{
    e.tasks=(e.tasks||[]).map(asTask).filter(x=>x.t);
    /* migrate a legacy per-person status/helpFrom/helpNote onto every task,
       and 'out' onto a standalone away flag — a one-time upgrade */
    if(e.status!==undefined){
      if(e.status==='out') e.awayType='away';
      else if(e.status) e.tasks.forEach(tk=>{ if(!tk.status) tk.status=e.status; });
      if(e.helpFrom && e.helpFrom.length) e.tasks.forEach(tk=>{ if(!tk.helpFrom||!tk.helpFrom.length) tk.helpFrom=[...e.helpFrom]; });
      if(e.helpNote) e.tasks.forEach(tk=>{ if(!tk.helpNote) tk.helpNote=e.helpNote; });
      delete e.status; delete e.helpFrom; delete e.helpNote;
    }
    if(e.away===true && !e.awayType) e.awayType='away';
    delete e.away;
    if(e.awayType===undefined) e.awayType='';
    if(e.awayProject===undefined) e.awayProject='';
  });
  return d;
}

/* ============================================================
   Name matching
   ============================================================ */
function aliasIndex(){
  const map = new Map();
  S.roster.forEach(m=>{
    const all = [m.name, m.thai].concat(m.aliases||[]).filter(Boolean);
    all.forEach(a=>{
      const n = norm(a);
      if(!n) return;
      if(AMBIGUOUS[n]) return;              // never let an ambiguous token resolve silently
      if(!map.has(n)) map.set(n, new Set());
      map.get(n).add(m.id);
    });
  });
  return map;
}

/* returns {ids:[...], ambiguous:bool} */
function resolveName(token){
  const n = norm(token);
  if(!n) return {ids:[],ambiguous:false};
  if(AMBIGUOUS[n]) return {ids:AMBIGUOUS[n].filter(memberById), ambiguous:true};
  const idx = aliasIndex();
  if(idx.has(n)){
    const ids=[...idx.get(n)];
    return {ids, ambiguous: ids.length>1};
  }
  // loose: alias contained in token or vice versa (handles "พี่ไข่ครับ", "Gong(DevOps)")
  let hits=[];
  idx.forEach((ids,alias)=>{
    if(alias.length>=2 && (n.startsWith(alias) || n.includes(alias))) hits.push(...ids);
  });
  hits=[...new Set(hits)];
  if(hits.length) return {ids:hits, ambiguous:hits.length>1};
  // ambiguous root inside a longer token, e.g. "zeenครับ"
  for(const key in AMBIGUOUS){ if(n.includes(key)) return {ids:AMBIGUOUS[key].filter(memberById), ambiguous:true}; }
  return {ids:[],ambiguous:false};
}

/* find members mentioned inside free text (for "who did they name?") */
function mentionsIn(text, excludeId){
  const found=new Set(); let ambiguous=false;
  const low = String(text||'').toLowerCase();
  S.roster.forEach(m=>{
    const all=[m.name,m.thai].concat(m.aliases||[]).filter(Boolean);
    for(const a of all){
      const na=norm(a);
      if(!na || AMBIGUOUS[na]) continue;
      const isLatin = /^[a-z0-9'".\s]+$/i.test(a);
      let hit=false;
      if(isLatin){
        const safe=a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        hit = new RegExp('(^|[^a-z0-9])'+safe+'([^a-z0-9]|$)','i').test(low);
      }else{
        hit = low.includes(a.toLowerCase());
      }
      if(hit){ found.add(m.id); break; }
    }
  });
  for(const key in AMBIGUOUS){ if(low.includes(key)) ambiguous=true; }
  if(excludeId) found.delete(excludeId);
  return {ids:[...found], ambiguous};
}

   ============================================================ */
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,
  'ม.ค.':1,'ก.พ.':2,'มี.ค.':3,'เม.ย.':4,'พ.ค.':5,'มิ.ย.':6,'ก.ค.':7,'ส.ค.':8,'ก.ย.':9,'ต.ค.':10,'พ.ย.':11,'ธ.ค.':12};
function iso(y,m,d){
  if(y<100) y = y>=60 ? y+2500 : y+2000;   // "69" reads as พ.ศ. 2569
  if(y>2400) y-=543;                       // Buddhist era
  if(!y||!m||!d||m>12||d>31) return null;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function detectDate(line){
  const s=line.trim();
  if(s.length>28) return null;
  let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return iso(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/))) return iso(+m[3],+m[2],+m[1]);
  if((m=s.match(/^(\d{1,2})\s+([A-Za-z]{3,9}|[ก-๙.]{4,6})\.?\s+(\d{2,4})$/))){
    const key=/^[A-Za-z]/.test(m[2]) ? m[2].slice(0,3).toLowerCase() : m[2];
    return MON[key] ? iso(+m[3], MON[key], +m[1]) : null;
  }
  if((m=s.match(/^([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})$/))){
    const key=m[1].slice(0,3).toLowerCase();
    return MON[key] ? iso(+m[3], MON[key], +m[2]) : null;
  }
  return null;
}

/* A dash line is ALWAYS a task, never a name — that is how these notes are written.
   Sub-detail arrows (--> → ↳) are tasks too. Names sit alone on their own line. */
const DASH  = /^\s*(?:-{1,2}>?|[*•·▪+►]|→|↳|└)/;
const NUMB  = /^\s*\d{1,2}[.)]\s*/;
const SEP   = /^(.{1,40}?)\s*[:：|>»]\s*(.*)$/;
function stripBullet(s){
  return s.replace(/^\s*(?:-{1,2}>?|[*•·▪+►=]+|→|↳|└→?|\d{1,2}[.)])\s*/,'').trim();
}

function parseNotes(raw){
  const lines = String(raw||'').replace(/\r/g,'').split('\n');
  const rows = [];
  const found = {date:null};
  let cur = null;
  const push = () => { if(cur) rows.push(cur); cur = null; };
  const start = (token, res, rest) => {
    push();
    cur = {
      token: String(token).trim(),
      memberId: res.ambiguous ? '' : res.ids[0],
      options: res.ambiguous ? res.ids : null,
      ambiguous: res.ambiguous,
      items: rest ? [rest] : [],
      raw: String(token).trim()
    };
  };

  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    const trimmed = line.trim();
    if(!trimmed) continue;
    if(/^[=_–—]{3,}$/.test(trimmed) || /^-{3,}$/.test(trimmed)) continue;

    const dl = detectDate(trimmed.replace(/^(date|วันที่|standup)\s*[:：]?\s*/i,''));
    if(dl){ found.date = dl; continue; }

    const isTask = DASH.test(line);
    const body = stripBullet(trimmed);
    if(!body) continue;

    if(!isTask){
      // 1. the whole line is just a name — the usual case
      const bare = body.replace(/[:：]\s*$/,'').replace(/\s*\([^)]*\)\s*$/,'').trim();
      if(bare.length <= 30){
        const r = resolveName(bare);
        if(r.ids.length){ start(bare, r, ''); continue; }
      }
      // 2. "Name: task" on one line
      const m = body.match(SEP);
      if(m){
        const r = resolveName(m[1]);
        if(r.ids.length){ start(m[1], r, m[2].trim()); continue; }
      }
      // 3. "Name task" — first word or two only
      const words = body.split(/\s+/);
      let matched = false;
      for(let take=Math.min(2,words.length); take>=1; take--){
        const cand = words.slice(0,take).join(' ').replace(/[,:.]$/,'');
        const r = resolveName(cand);
        if(r.ids.length){
          start(cand, r, words.slice(take).join(' ').replace(/^[\-–—:,>]\s*/,'').trim());
          matched = true; break;
        }
      }
      if(matched) continue;
      // 4. a short line with dash-tasks under it is a name we do not know yet
      if(body.length <= 25){
        let j=i+1; while(j<lines.length && !lines[j].trim()) j++;
        if(j<lines.length && DASH.test(lines[j])){
          push();
          cur = {token:body, memberId:'', options:null, ambiguous:false, unknown:true, newName:true, items:[], raw:body};
          continue;
        }
      }
    }

    if(cur){ cur.items.push(body); continue; }
    const last = rows[rows.length-1];
    if(last && last.unknown && !last.newName){ last.items.push(body); last.raw += '\n'+body; }
    else rows.push({token:'', memberId:'', options:null, ambiguous:false, unknown:true, items:[body], raw:body});
  }
  push();

  rows.forEach(r=>{
    const text = r.items.join(' ');
    r.status = sniffStatus(text);
    const mm = mentionsIn(text, r.memberId);
    r.helpFrom = mm.ids;
    r.mentionAmbiguous = mm.ambiguous;
  });
  rows.detectedDate = found.date;
  rows.named = rows.filter(r=>r.memberId||r.ambiguous).length;
  return rows;
}

function dateFromName(n){
  const s = String(n||'').replace(/\.[a-z0-9]+$/i,'');
  let m;
  if((m=s.match(/(20\d{2})[-_.]?(\d{1,2})[-_.]?(\d{1,2})(?!\d)/))) return iso(+m[1],+m[2],+m[3]);
  if((m=s.match(/(\d{1,2})[-_.](\d{1,2})[-_.](20\d{2}|\d{2})(?!\d)/))) return iso(+m[3],+m[2],+m[1]);
  return null;
}

async function importRows(rows, date, mode){
  const day = normalizeDay(mode==='replace' ? blankDay(date) : (await loadDay(date)));
  let used=0, skipped=0;
  (rows||[]).forEach(r=>{
    if(!r.memberId){ skipped++; return; }
    if(!day.entries[r.memberId]) day.entries[r.memberId]=blankEntry();
    const e=day.entries[r.memberId];
    const tasks=r.items.map(s=>s.trim()).filter(Boolean).map(t=>({
      t, p:detectProject(t), status:sniffStatus(t), helpFrom:mentionsIn(t, r.memberId).ids, helpNote:''
    }));
    const have=new Set(e.tasks.map(x=>x.t));
    e.tasks = mode==='replace' ? tasks : e.tasks.concat(tasks.filter(x=>!have.has(x.t)));
    e.touched=true;
    used++;
  });
  day.updatedAt=new Date().toISOString();
  S.cache.set(date,day);
  await store.set(K_DAY(date), day);
  if(date===S.date) S.day=day;
  return {used, skipped};
}

async function applyImport(mode){
  const date = document.getElementById('imp-date').value || S.date;
  const {used, skipped} = await importRows(S.parsed, date, mode);
  S.parsed=null;
  const raw=document.getElementById('imp-raw'); if(raw) raw.value='';
  toast(`Imported ${used} ${used===1?'person':'people'} into ${date}` + (skipped?` · ${skipped} left out`:''));
  S.tab='summary'; S.date=date;
  document.getElementById('thedate').value=date;
  S.day=await loadDay(date);
  render();
}

async function importQueue(){
  const ready=(S.queue||[]).filter(f=>f.rows.named>0 && !f.rows.some(r=>!r.memberId));
  if(!ready.length){ toast('No file is fully matched yet — open one and assign the leftovers'); return; }
  let people=0;
  for(const f of ready){ const {used}=await importRows(f.rows, f.date, 'merge'); people+=used; f.done=true; }
  toast(`Imported ${ready.length} file${ready.length===1?'':'s'} · ${people} entries`);
  S.day=await loadDay(S.date);
  renderImport();
}

function buildMarkdown(date, day){
  const out=[`# Daily standup — ${prettyDate(date)}`,''];
  const rows=S.roster.map(m=>({m,e:day.entries[m.id]})).filter(x=>isCaptured(x.e));
  const away=rows.filter(x=>x.e.awayType);
  out.push('## Today');
  rows.filter(x=>!x.e.awayType).forEach(({m,e})=>{
    out.push(`**${m.name}**${m.role?` · ${m.role}`:''}`);
    (e.tasks||[]).forEach(x=>{
      const who=(x.helpFrom||[]).map(id=>(memberById(id)||{}).name).filter(Boolean).join(', ');
      let line=`- ${x.t}${x.p?`  [${projectName(x.p)}]`:''}`;
      if(x.status==='blocked') line+=' *(blocked)*'; else if(x.status==='help') line+=' *(needs help)*';
      if(who) line+=` — with ${who}`;
      out.push(line);
      if(x.helpNote) out.push(`  ↳ ${x.helpNote}`);
    });
    if(!e.tasks||!e.tasks.length) out.push('- (no tasks noted)');
    out.push('');
  });
  const bp={};
  rows.filter(x=>!x.e.awayType).forEach(({m,e})=>(e.tasks||[]).forEach(x=>{
    const k=x.p?projectName(x.p):'Untagged'; (bp[k]=bp[k]||[]).push(m.name);
  }));
  const bpKeys=Object.keys(bp).sort((a,b)=>bp[b].length-bp[a].length);
  if(bpKeys.length){
    out.push('## By project');
    bpKeys.forEach(k=>out.push(`- **${k}** (${bp[k].length}) — ${[...new Set(bp[k])].join(', ')}`));
    out.push('');
  }
  const flagRows=rows.flatMap(({m,e})=>(e.tasks||[]).filter(x=>x.status==='help'||x.status==='blocked').map(x=>({m,x})));
  if(flagRows.length){
    out.push('## Needs help / blocked');
    flagRows.forEach(({m,x})=>{
      const who=(x.helpFrom||[]).map(id=>(memberById(id)||{}).name).filter(Boolean).join(', ');
      out.push(`- **${m.name}** — ${x.t} → ${who||'unassigned'}${x.helpNote?` — ${x.helpNote}`:''}${x.status==='blocked'?' *(blocked)*':''}`);
    });
    out.push('');
  }
  if(away.length){
    out.push(`## Away`);
    away.forEach(x=>out.push(`- ${x.m.name}${x.e.awayType==='leave'?' (leave)':x.e.awayProject?` (away — ${projectName(x.e.awayProject)})`:' (away)'}`));
  }
  return out.join('\n');
}

  drop.addEventListener('drop', e=>readFiles(e.dataTransfer.files));

async function readFiles(fileList){
  const files=[...(fileList||[])];
  if(!files.length) return;
  const images=files.filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic)$/i.test(f.name));
  const texts=files.filter(f=>!images.includes(f));
  S.queue = S.queue || [];
  for(const f of texts){
    let text='';
    try{ text = await f.text(); }catch(e){ continue; }
    const rows = parseNotes(text);
    S.queue.push({name:f.name, date: rows.detectedDate || dateFromName(f.name) || S.date, text, rows});
  }
  if(images.length) toast(`${images.length} photo${images.length===1?'':'s'} skipped — handwriting has to be typed up first`);
  paintQueue();
}

function paintQueue(){
  const box=document.getElementById('filequeue'); if(!box) return;
  const q=S.queue||[];
  if(!q.length){ box.innerHTML=''; return; }
  box.innerHTML = `
    <div class="row" style="justify-content:space-between;margin:16px 0 8px">
      <b style="font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">${q.length} file${q.length===1?'':'s'}</b>
      <div class="row" style="gap:6px">
        <button class="btn primary" data-queueall="1" style="padding:6px 11px;font-size:12.5px">Import every matched file</button>
        <button class="btn quiet" data-queueclear="1">Clear</button>
      </div>
    </div>
    ${q.map((f,i)=>{
      const bad=f.rows.filter(r=>!r.memberId).length;
      const state = f.done ? '<span class="tag ok">Imported</span>'
        : !f.rows.named ? '<span class="tag block">No names</span>'
        : bad ? `<span class="tag help">${bad} to check</span>` : '<span class="tag ok">Ready</span>';
      return `<div class="qrow">
        <button class="btn quiet" data-openfile="${i}" style="flex:1;text-align:left;padding:4px 0;color:var(--ink)">${esc(f.name)}</button>
        <span class="alias">${esc(f.date)}</span>
        <span class="alias">${f.rows.named} ppl</span>
        ${state}
      </div>`;
    }).join('')}`;
}

function openQueueFile(i){
  const f=(S.queue||[])[i]; if(!f) return;
  document.getElementById('imp-raw').value=f.text;
  document.getElementById('imp-date').value=f.date;
  S.parsed=f.rows;
  paintParsed();
  if(!f.rows.named) toast('No names in this one — it may not be a standup note');
}

function runParse(text){
  S.parsed = parseNotes(text);
  const d = S.parsed.detectedDate;
  if(d){ const f=document.getElementById('imp-date'); if(f){ f.value=d; toast('Dated '+prettyDate(d)+' — change it if that is wrong'); } }
  paintParsed();
}

function paintParsed(){
  const box=document.getElementById('imp-rows'); if(!box) return;
  const rows=S.parsed||[];
  if(!rows.length){ box.innerHTML=`<div class="empty">Nothing recognised in that note. Try one person per line, like <b>Amp: deploy to UAT</b>.</div>`; document.getElementById('imp-actions').style.display='none'; return; }
  const opts = extra => `<option value="">— choose a person —</option>` + S.roster.map(m=>`<option value="${m.id}" ${extra===m.id?'selected':''}>${esc(m.name)}${m.thai&&norm(m.thai)!==norm(m.name)?' ('+esc(m.thai)+')':''}${isFormer(m)?' — former':''}</option>`).join('');
  box.innerHTML = rows.map((r,i)=>`
    <div class="prow ${r.ambiguous&&!r.memberId?'ambig':''} ${!r.memberId&&!r.ambiguous?'unknown':''}">
      <div class="prow-top">
        <select data-assign="${i}">${opts(r.memberId)}</select>
        ${r.ambiguous?'<span class="warn">Which Zeen?</span>':''}
        ${!r.memberId&&!r.ambiguous?'<span class="warn">Unmatched</span>':''}
        ${r.status==='blocked'?'<span class="tag block">Blocked</span>':r.status==='help'?'<span class="tag help">Help</span>':''}
      </div>
      <div class="prow-raw">${esc(r.items.join('\n'))}</div>
      ${r.token?`<div class="note" style="margin-top:6px">Written as “${esc(r.token)}”</div>`:''}
      ${r.helpFrom&&r.helpFrom.length?`<div class="note">Mentions: ${r.helpFrom.map(id=>esc((memberById(id)||{}).name||'')).join(', ')}</div>`:''}
      ${r.token && !r.memberId && !r.ambiguous ? `<div class="row" style="margin-top:8px;gap:6px">
        <button class="btn" data-newperson="${i}:active" style="padding:6px 11px;font-size:12.5px">Add “${esc(r.token)}” to the team</button>
        <button class="btn" data-newperson="${i}:former" style="padding:6px 11px;font-size:12.5px">Add as former member</button>
      </div>`:''}
      ${r.mentionAmbiguous?`<div class="row" style="margin-top:8px;gap:6px">
        <span class="warn">Names a “Zeen” —</span>
        ${(AMBIGUOUS['zeen']||[]).filter(memberById).map(id=>`<button class="chip" data-mention="${i}:${id}" aria-pressed="${(r.helpFrom||[]).includes(id)}">${esc((memberById(id)||{}).name)}</button>`).join('')}
      </div>`:''}
    </div>`).join('');
  const unresolved = rows.filter(r=>!r.memberId).length;
  document.getElementById('imp-count').textContent = `${rows.length} block${rows.length===1?'':'s'}${unresolved?` · ${unresolved} still to assign`:' · all matched'}`;
  document.getElementById('imp-actions').style.display='flex';
}

async function retagAll(){
  (await store.all('standup:')).forEach(r=>{
    const date=r.key.replace('standup:','');
    if(!S.cache.has(date)) S.cache.set(date, normalizeDay(r.value));
  });
  const dates=[...S.cache.keys()];
  let n=0;
  for(const date of dates){
    const d=normalizeDay(S.cache.get(date) || blankDay(date));
    let touched=false;
    Object.values(d.entries||{}).forEach(e=>(e.tasks||[]).forEach(x=>{
      if(!x.p){ const g=detectProject(x.t); if(g){ x.p=g; n++; touched=true; } }
    }));
    if(touched){ S.cache.set(date,d); await store.set(K_DAY(date), d); }
  }
  S.day=await loadDay(S.date);
  toast(n?`Tagged ${n} task${n===1?'':'s'}`:'Nothing new to tag');
}

/* counts DAYS, not tasks — a project mentioned three times in one day is one day.
   also rolls up attendance, task volume, and blocked/help days per person. */
function computeReport(fromDate, toDate){
  const days=[...S.cache.entries()]
    .filter(([date])=>(!fromDate||date>=fromDate)&&(!toDate||date<=toDate));
  const matrix={}, memberTotals={};
  const activeDates=new Set();
  const ensure=id=>{
    if(!matrix[id]) matrix[id]={};
    if(!memberTotals[id]) memberTotals[id]={daysReported:0,tasksLogged:0,blockedDays:0,helpDays:0,awayDays:0,leaveDays:0,projects:new Set()};
    return memberTotals[id];
  };
  S.roster.forEach(m=>ensure(m.id));
  days.forEach(([date,d])=>{
    Object.entries(d.entries||{}).forEach(([id,e])=>{
      if(!isCaptured(e)) return;
      activeDates.add(date);
      const mt=ensure(id);
      mt.daysReported++;
      if(e.awayType==='away') mt.awayDays++;
      else if(e.awayType==='leave') mt.leaveDays++;
      const flag=entryFlag(e);
      if(flag==='blocked') mt.blockedDays++;
      else if(flag==='help') mt.helpDays++;
      const seenToday=new Set();
      (e.tasks||[]).forEach(tk=>{
        mt.tasksLogged++;
        const key=tk.p||'_none';
        if(!seenToday.has(key)){
          seenToday.add(key);
          matrix[id][key]=(matrix[id][key]||0)+1;
          mt.projects.add(key);
        }
      });
    });
  });
  const projectTotals={};
  Object.values(matrix).forEach(row=>Object.entries(row).forEach(([k,v])=>{ projectTotals[k]=(projectTotals[k]||0)+v; }));
  return {matrix, memberTotals, projectTotals, dayCount:activeDates.size};
}

function csvField(v){
  v=String(v==null?'':v);
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}

function buildReportCSV(){
  const {matrix, memberTotals, projectTotals, dayCount}=computeReport(S.reportFrom, S.reportTo);
  const projIds=Object.keys(projectTotals).sort((a,b)=>projectTotals[b]-projectTotals[a]);
  const header=['Person','Days reported', ...projIds.map(k=>k==='_none'?'Untagged':projectName(k)),
    'Blocked days','Needs-help days','Away days','Leave days','Tasks logged','Projects touched'];
  const lines=[header.map(csvField).join(',')];
  S.roster.forEach(m=>{
    const mt=memberTotals[m.id]||{daysReported:0,tasksLogged:0,blockedDays:0,helpDays:0,awayDays:0,leaveDays:0,projects:new Set()};
    const row=matrix[m.id]||{};
    const line=[m.name, mt.daysReported, ...projIds.map(k=>row[k]||0),
      mt.blockedDays||0, mt.helpDays||0, mt.awayDays||0, mt.leaveDays||0, mt.tasksLogged||0, mt.projects?mt.projects.size:0];
    lines.push(line.map(csvField).join(','));
  });
  return lines.join('\n');
}

async function renderReport(){
  view().innerHTML = `<h2>Report</h2><div class="empty">Reading the log…</div>`;
  await ensureAllDaysCached();
  if(!S.reportFrom){
    const to=todayISO();
    const d=new Date(); d.setDate(d.getDate()-29);
    S.reportFrom=d.toISOString().slice(0,10);
    S.reportTo=to;
  }
  paintReport();
}

function paintReport(){
  const {matrix, memberTotals, projectTotals, dayCount}=computeReport(S.reportFrom, S.reportTo);
  const projIds=Object.keys(projectTotals).sort((a,b)=>projectTotals[b]-projectTotals[a]);
  const projLabel=k=>k==='_none'?'Untagged':esc(projectName(k));
  const byProject = S.reportView==='project';

  let matrixSection;
  if(byProject){
    matrixSection = `
      <h2>Days per person, by project · ${dayCount} day${dayCount===1?'':'s'} in range</h2>
      <div class="digest">
        ${projIds.length ? projIds.map(k=>{
          const rows=S.roster.map(m=>({m, days:(matrix[m.id]&&matrix[m.id][k])||0})).filter(r=>r.days>0).sort((a,b)=>b.days-a.days);
          return `<div class="line">
            <div class="line-name">${projLabel(k)}</div>
            <div class="line-body">
              ${rows.length?`<ul>${rows.map(r=>`<li><b>${esc(r.m.name)}</b>${isFormer(r.m)?' <span class="note">(former)</span>':''} — ${r.days} day${r.days===1?'':'s'}</li>`).join('')}</ul>`:'<span class="note">Nobody logged this project in range.</span>'}
            </div>
            <div><span class="tag">${projectTotals[k]} total</span></div>
          </div>`;
        }).join('') : '<div class="empty">No projects logged in this range.</div>'}
      </div>`;
  }else{
    const bodyRows=S.roster.map(m=>{
      const mt=memberTotals[m.id]||{daysReported:0,blockedDays:0,helpDays:0,awayDays:0,leaveDays:0};
      const row=matrix[m.id]||{};
      return `<tr>
        <td>${esc(m.name)}${isFormer(m)?' <span class="note">(former)</span>':''}</td>
        <td>${mt.daysReported||''}</td>
        ${projIds.map(k=>`<td>${row[k]||''}</td>`).join('')}
        <td>${mt.blockedDays||''}</td>
        <td>${mt.helpDays||''}</td>
        <td>${mt.awayDays||''}</td>
        <td>${mt.leaveDays||''}</td>
      </tr>`;
    }).join('');
    const totalsRow=`<tr class="rpt-total">
      <td>Total</td><td>${dayCount}</td>
      ${projIds.map(k=>`<td>${projectTotals[k]}</td>`).join('')}
      <td colspan="4"></td>
    </tr>`;
    matrixSection = `
      <h2>Days per project, by person · ${dayCount} day${dayCount===1?'':'s'} in range</h2>
      <div class="rpt-wrap">
        <table class="rpt-table">
          <thead><tr>
            <th>Person</th><th>Days reported</th>
            ${projIds.map(k=>`<th>${projLabel(k)}</th>`).join('')}
            <th>Blocked</th><th>Needs help</th><th>Away</th><th>Leave</th>
          </tr></thead>
          <tbody>${bodyRows}${totalsRow}</tbody>
        </table>
      </div>`;
  }

  view().innerHTML = `
    <h2>Report</h2>
    <p class="lede">Counts days, not tasks — working on the same project three times in one day still counts once. Pick a range to look at a sprint, a month, or everything logged.</p>

    <div class="panel" style="margin-bottom:18px">
      <div class="row">
        <div class="field" style="margin:0"><label for="rpt-from">From</label><input type="date" id="rpt-from" value="${S.reportFrom}"></div>
        <div class="field" style="margin:0"><label for="rpt-to">To</label><input type="date" id="rpt-to" value="${S.reportTo}"></div>
        <button class="btn" data-rptrange="7">Last 7 days</button>
        <button class="btn" data-rptrange="30">Last 30 days</button>
        <button class="btn" data-rptrange="all">All time</button>
        <button class="btn primary" data-rptcsv="1" style="margin-left:auto">Download CSV</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn ${byProject?'':'primary'}" data-rptview="person">By person</button>
        <button class="btn ${byProject?'primary':''}" data-rptview="project">By project</button>
      </div>
    </div>

    ${matrixSection}

    <h2>Other measures</h2>
    <div class="digest">
      ${S.roster.map(m=>{
        const mt=memberTotals[m.id]||{daysReported:0,tasksLogged:0,blockedDays:0,projects:new Set()};
        const rate=dayCount?Math.round((mt.daysReported||0)/dayCount*100):0;
        const avgTasks=mt.daysReported?(mt.tasksLogged/mt.daysReported).toFixed(1):'0.0';
        const projCount=mt.projects?mt.projects.size:0;
        return `<div class="line">
          <div class="line-name">${esc(m.name)}</div>
          <div class="line-body"><span class="note">Reported ${mt.daysReported||0}/${dayCount} days (${rate}%) · ${mt.tasksLogged||0} tasks logged · avg ${avgTasks}/day · ${projCount} project${projCount===1?'':'s'} touched</span></div>
          <div>${mt.blockedDays?`<span class="tag block">${mt.blockedDays} blocked</span>`:''}</div>
        </div>`;
      }).join('')}
    </div>
    <p class="note" style="margin-top:10px">Reported-day rate and task volume are activity measures, not quality ones — a full picture of KPIs still needs your own read on what got shipped. Use the CSV to bring these numbers into whatever review process you already run.</p>`;

  document.getElementById('rpt-from').addEventListener('change', e=>{ S.reportFrom=e.target.value; paintReport(); });
  document.getElementById('rpt-to').addEventListener('change', e=>{ S.reportTo=e.target.value; paintReport(); });
}

document.addEventListener('click', async e=>{
  const t=e.target;

  const go=t.closest('[data-goto]');
  if(go){ S.active=go.dataset.goto; renderStandup(); return; }

  const per=t.closest('[data-person]');
  if(per){ S.personId=per.dataset.person; renderPeople(); return; }

  const awt=t.closest('[data-awaytype]');
  if(awt){
    const en=entryOf(S.active); const kind=awt.dataset.awaytype;
    en.awayType = en.awayType===kind ? '' : kind;
    if(en.awayType!=='away') en.awayProject='';
    en.touched=true; queueSave(); renderStandup(); return;
  }

  const ts=t.closest('[data-taskstatus]');
  if(ts){
    const [i,status]=ts.dataset.taskstatus.split(':');
    const en=entryOf(S.active); const tk=en.tasks[+i]; if(!tk) return;
    tk.status = tk.status===status ? '' : status;
    en.touched=true; queueSave(); paintTaskDetails(); return;
  }

  const th=t.closest('[data-taskhelp]');
  if(th){
    const [i,id]=th.dataset.taskhelp.split(':');
    const en=entryOf(S.active); const tk=en.tasks[+i]; if(!tk) return;
    tk.helpFrom=tk.helpFrom||[];
    tk.helpFrom.includes(id) ? tk.helpFrom=tk.helpFrom.filter(x=>x!==id) : tk.helpFrom.push(id);
    en.touched=true; queueSave();
    th.setAttribute('aria-pressed', String(tk.helpFrom.includes(id))); return;
  }

  if(t.closest('[data-clear]')){
    delete S.day.entries[S.active]; queueSave(); renderStandup(); toast('Cleared'); return;
  }

  if(t.closest('[data-parse]')){ runParse(document.getElementById('imp-raw').value); return; }
  if(t.closest('[data-sample]')){
    document.getElementById('imp-raw').value=SAMPLE; runParse(SAMPLE); return;
  }
  const of_=t.closest('[data-openfile]');
  if(of_){ openQueueFile(+of_.dataset.openfile); return; }
  if(t.closest('[data-queueall]')){ importQueue(); return; }
  if(t.closest('[data-queueclear]')){ S.queue=[]; paintQueue(); return; }

  const np=t.closest('[data-newperson]');
  if(np){
    const [ix,kind]=np.dataset.newperson.split(':');
    const i=+ix, r=S.parsed[i];
    const name=(prompt('Add this person as:', r.token)||'').trim();
    if(!name) return;
    const id='m'+Date.now().toString(36);
    const thai=/[ก-๙]/.test(name)?name:'';
    const former = kind==='former';
    S.roster.push({id, name, thai, role: former?'Intern':'', active: !former,
      note: former?'Former member — kept for old notes':'',
      aliases:[r.token].filter(a=>a&&a!==name)});
    await saveRoster();
    (S.queue||[]).forEach(f=>f.rows.forEach(row=>{
      if(!row.memberId && norm(row.token)===norm(r.token)){ row.memberId=id; row.unknown=false; }
    }));
    r.memberId=id; r.unknown=false;
    S.parsed.forEach(row=>{ if(!row.memberId && norm(row.token)===norm(r.token)){ row.memberId=id; row.unknown=false; } });
    paintParsed(); paintQueue();
    toast(former ? `${name} added as a former member` : `${name} added to the roll call`);
    return;
  }

  const mn=t.closest('[data-mention]');
  if(mn){
    const [i,id]=mn.dataset.mention.split(':'); const r=S.parsed[+i];
    r.helpFrom=r.helpFrom||[];
    r.helpFrom.includes(id) ? r.helpFrom=r.helpFrom.filter(x=>x!==id) : r.helpFrom.push(id);
    paintParsed(); return;
  }
  const ap=t.closest('[data-apply]');
  if(ap){
    if((S.parsed||[]).some(r=>!r.memberId) && !confirm('Some blocks still have no person assigned. They will be skipped. Continue?')) return;
    applyImport(ap.dataset.apply); return;
  }

  if(t.closest('[data-copy]')){
    const txt=buildMarkdown(S.date,S.day);
    try{ await navigator.clipboard.writeText(txt); toast('Copied'); }
    catch(err){ const p=document.getElementById('mdout'); const r=document.createRange(); r.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Select and copy'); }
    return;
  }
  if(t.closest('[data-download]')){
    download(`standup-${S.date}.md`, buildMarkdown(S.date,S.day), 'text/markdown'); return;
  }
  if(t.closest('[data-backup]')){
    const days={};
    (await store.all('standup:')).forEach(r=>{ days[r.key]=r.value; });
    download(`standup-backup-${todayISO()}.json`, JSON.stringify({roster:S.roster,projects:S.projects,days},null,2), 'application/json');
    toast('Backup downloaded'); return;
  }

  if(t.closest('[data-sbsave]')){
    const url=document.getElementById('sb-url').value.trim();
    const key=document.getElementById('sb-key').value.trim();
    if(!/^https:\/\/.+/.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)/.test(url)){
      toast('The URL should start with https://'); return; }
    if(key.length<20){ toast('That key looks too short'); return; }
    cloud.saveCfg(url,key); toast('Project saved — now sign in'); renderSync(); return;
  }
  if(t.closest('[data-sbforget]')){
    if(!confirm('Forget this Supabase project on this device? Data already in the cloud is untouched.')) return;
    cloud.clear(); await reloadEverything(); S.tab='sync'; render(); return;
  }
  if(t.closest('[data-sbin]')){
    const email=document.getElementById('sb-email').value.trim();
    const pass=document.getElementById('sb-pass').value;
    const msg=document.getElementById('sb-msg');
    msg.textContent='Signing in…';
    const ok = await cloud.signIn(email, pass).catch(()=>false);
    if(!ok){ msg.textContent = cloud.lastError || 'Could not sign in'; return; }
    toast('Signed in'); await reloadEverything(); S.tab='sync'; render(); return;
  }
  if(t.closest('[data-sbout]')){ cloud.signOut(); await reloadEverything(); S.tab='sync'; render(); return; }
  if(t.closest('[data-sbpush]')){
    if(!confirm("Upload this device's data to the shared log? Days that exist in both are replaced by this device's copy.")) return;
    await pushLocal(); return;
  }
  if(t.closest('[data-sbtest]')){
    try{ const rows=await cloud.all('standup:'); toast(`Connected · ${rows.length} day${rows.length===1?'':'s'} in the shared log`); }
    catch(e){ toast('Could not reach the table — check the SQL ran'); }
    return;
  }

  if(t.closest('[data-projadd]')){
    const name=(prompt('Project name:')||'').trim();
    if(!name) return;
    S.projects.splice(Math.max(0,S.projects.length-1),0,{id:'p'+Date.now().toString(36),name,keywords:[]});
    await saveProjects(); renderProjects(); return;
  }
  const prm=t.closest('[data-projremove]');
  if(prm){
    const pr=projectById(prm.dataset.projremove);
    if(pr && confirm(`Remove ${pr.name}? Tasks already tagged with it keep the tag until you change them.`)){
      S.projects=S.projects.filter(x=>x.id!==pr.id); await saveProjects(); renderProjects();
    }
    return;
  }
  if(t.closest('[data-retag]')){ await retagAll(); return; }

  const rv=t.closest('[data-rptview]');
  if(rv){ S.reportView = rv.dataset.rptview; paintReport(); return; }

  const rr=t.closest('[data-rptrange]');
  if(rr){
    const kind=rr.dataset.rptrange;
    if(kind==='all'){
      const dates=[...S.cache.keys()].sort();
      S.reportFrom = dates.length?dates[0]:todayISO();
    }else{
      const d=new Date(); d.setDate(d.getDate()-(+kind-1));
      S.reportFrom = d.toISOString().slice(0,10);
    }
    S.reportTo = todayISO();
    paintReport(); return;
  }
  if(t.closest('[data-rptcsv]')){
    download(`standup-report-${S.reportFrom}_to_${S.reportTo}.csv`, buildReportCSV(), 'text/csv');
    return;
  }

  if(t.closest('[data-add]')){
    const id='m'+Date.now().toString(36);
    S.roster.push({id,name:'New person',thai:'',role:'',aliases:[]});
    await saveRoster(); renderTeam(); return;
  }
  const ta_=t.closest('[data-toggleactive]');
  if(ta_){
    const m=memberById(ta_.dataset.toggleactive);
    if(m){ m.active = isFormer(m) ? true : false; await saveRoster(); renderTeam();
      toast(isFormer(m) ? `${m.name} moved to former members` : `${m.name} is back on the roll call`); }
    return;
  }

  const rm=t.closest('[data-remove]');
  if(rm){
    const m=memberById(rm.dataset.remove);
    if(m && confirm(`Remove ${m.name} from the roster? Past notes stay in the log.`)){
      S.roster=S.roster.filter(x=>x.id!==m.id); await saveRoster(); renderTeam();
    }
    return;
  }
});

document.addEventListener('change', async e=>{
  const as=e.target.closest('[data-assign]');
  if(as){
    const i=+as.dataset.assign; const r=S.parsed[i];
    r.memberId=as.value; r.ambiguous=false;
    r.helpFrom=mentionsIn(r.items.join(' '), r.memberId).ids;
    paintParsed(); return;
  }
  const tp=e.target.closest('[data-taskproj]');
  if(tp){
    const en=entryOf(S.active); const i=+tp.dataset.taskproj;
    if(en.tasks[i]){ en.tasks[i].p=tp.value; en.touched=true; queueSave(); }
    tp.classList.toggle('set', !!tp.value);
    return;
  }
  const pe=e.target.closest('[data-projedit]');
  if(pe){
    const pr=projectById(pe.dataset.pid); if(!pr) return;
    if(pe.dataset.projedit==='keywords') pr.keywords=pe.value.split(',').map(x=>x.trim()).filter(Boolean);
    else pr.name=pe.value.trim();
    await saveProjects(); return;
  }
  const ed=e.target.closest('[data-edit]');
  if(ed){
    const m=memberById(ed.dataset.id); if(!m) return;
    const f=ed.dataset.edit, v=ed.value;
    if(f==='aliases') m.aliases=v.split(',').map(s=>s.trim()).filter(Boolean);
    else if(f==='role') m[f]=v.startsWith('—')?'':v;
    else m[f]=v.trim();
    await saveRoster(); return;
  }
  if(e.target.id==='restore'){
    const file=e.target.files[0]; if(!file) return;
    try{
      const data=JSON.parse(await file.text());
      if(data.roster){ S.roster=data.roster; await saveRoster(); }
      if(data.projects){ S.projects=data.projects; await saveProjects(); }
      if(data.days){ for(const k in data.days){ await store.set(k,data.days[k]); S.cache.set(k.replace('standup:',''),data.days[k]); } }
      S.day=await loadDay(S.date);
      toast('Backup restored'); render();
    }catch(err){ toast('That file could not be read'); }
  }
});

function download(name, text, type){
  const b=new Blob([text],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}

function showStorageMode(){
  const bar=document.getElementById('storagebar'), txt=document.getElementById('storagebar-text');
  if(store.mode==='cloud'){
    bar.hidden=false; bar.classList.add('ok');
    txt.innerHTML=`Shared log — signed in as <b>${esc(cloud.session.email||'')}</b>. Your laptop and phone see the same notes.`;
    setTimeout(()=>{bar.hidden=true;}, 7000);
    return;
  }
  if(store.mode==='memory'){
    bar.hidden=false; bar.classList.remove('ok');
    txt.innerHTML='<b>Nothing is being saved.</b> This browser is blocking storage for a file opened straight from disk, so a refresh clears the day. Serve the file over http (see the Team tab) or use Chrome, then this bar turns green.';
  }else if(store.mode==='device'){
    bar.hidden=false; bar.classList.add('ok');
    txt.innerHTML='Saved on this device, in this browser. Back up from the Team tab now and then — clearing site data wipes it.';
    setTimeout(()=>{bar.hidden=true;}, 9000);
  }else{ bar.hidden=true; }
}

/* ---------- boot ---------- */
(async function init(){
  cloud.load();
  S.projects = await store.get(K_PROJ);
  if(!S.projects || !S.projects.length){
    S.projects = PROJECTS.map(p=>({...p}));
    await saveProjects();
  }else if(await store.get(PROJ_VERSION_KEY) !== PROJ_VERSION){
    /* merge: add projects that are new, union keywords onto ones already there,
       never drop a keyword or a project the user added themselves */
    PROJECTS.forEach(seed=>{
      const mine = S.projects.find(x=>x.id===seed.id);
      if(!mine){
        const at = S.projects.findIndex(x=>x.id==='other');
        S.projects.splice(at<0?S.projects.length:at, 0, {...seed});
      }else{
        mine.keywords = [...new Set((mine.keywords||[]).concat(seed.keywords||[]))];
      }
    });
    await saveProjects();
    await store.set(PROJ_VERSION_KEY, PROJ_VERSION);
    S._retagOnBoot = true;
  }
  S.roster = await store.get(K_ROSTER);
  if(!S.roster || !S.roster.length){
    S.roster = SEED.map(m=>({...m}));
    await saveRoster();
  }else if(!(await store.get('migrated:interns'))){
    SEED.filter(m=>m.active===false).forEach(m=>{
      if(!S.roster.some(x=>x.id===m.id || norm(x.name)===norm(m.name))) S.roster.push({...m});
    });
    await saveRoster();
    await store.set('migrated:interns', true);
  }
  document.getElementById('thedate').value = S.date;
  S.day = await loadDay(S.date);
  S.active = S.roster[0] && S.roster[0].id;
  showStorageMode();
  render();
  if(S._retagOnBoot){ S._retagOnBoot=false; await retagAll(); render(); }
})();
